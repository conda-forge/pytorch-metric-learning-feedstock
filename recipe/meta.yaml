{% set name = "pytorch-metric-learning" %}
{% set version = "3.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: a2b9a15990504773c11b459ff13d59cd2352b6ba420aea29740835475b31268a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy
    - scikit-learn
    - tqdm
    - pytorch >=1.6.0

test:
  imports:
    - pytorch_metric_learning
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/KevinMusgrave/pytorch-metric-learning
  summary: The easiest way to use deep metric learning in your application. Modular, flexible, and extensible. Written in PyTorch.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - giswqs
    - KevinMusgrave
