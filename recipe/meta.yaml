{% set name = "pytorch-metric-learning" %}
{% set version = "3.0.3" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pytorch_metric_learning-{{ version }}.tar.gz
  sha256: f0482dc376f954af2f83f85a48e3c735cac63e0a4de4a4a73bd63dea6810c9ae

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - setuptools ==84.0.0
  run:
    - python >={{ python_min }}
    - numpy >=2.5.3
    - pytorch >=2.14.0

test:
  imports:
    - pytorch_metric_learning
    - pytorch_metric_learning.distances
    - pytorch_metric_learning.distributed
    - pytorch_metric_learning.evaluation
    - pytorch_metric_learning.losses
    - pytorch_metric_learning.miners
    - pytorch_metric_learning.reducers
    - pytorch_metric_learning.regularizers
    - pytorch_metric_learning.samplers
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://github.com/KevinMusgrave/pytorch-metric-learning
  summary: Composable metric learning losses, miners, distances, samplers, and retrieval metrics for PyTorch.
  license: MIT
  license_file:
    - LICENSE
    - THIRD_PARTY_NOTICES.md

extra:
  recipe-maintainers:
    - giswqs
    - KevinMusgrave
